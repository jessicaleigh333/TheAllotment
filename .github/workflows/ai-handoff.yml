name: AI handoff
on:
  pull_request:
    paths:
      - 'docs/ai-handoff/**'
      - 'tools/ai_handoff/**'
      - '.github/workflows/ai-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'docs/ai-handoff/**'
      - 'tools/ai_handoff/**'
      - '.github/workflows/ai-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.ai_handoff.test_handoff -v
      - name: Verify published Markdown and history
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            python -m tools.ai_handoff check --base "$BASE"
          else
            python -m tools.ai_handoff check
          fi
